<!-- ==========================================
- TODOS LOS ICONOS DEBEN SER DE FONT AWESOME
- CADA SECCIÓN DEBE TENER COMENTARIOS BREVES
- LOS COMENTARIOS TIENEN QUE SER EN LETRAS MAYÚSCULAS
========================================== -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mapa</title>
    <!-- LEAFLET -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- FUENTE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">

        <!-- BARRA LATERAL PRINCIPAL -->
        <aside id="sidebar" class="sidebar">

            <!-- LOGO -->
            <div class="sidebar-logo">

                <div class="logo-mark">
                    <i class="fa-solid fa-location-dot"></i>
                </div>

                <div class="logo-text">
                    <h1>Mi Mapa</h1>
                </div>

            </div>

            <!-- MENÚ -->
            <nav class="sidebar-menu">

                <button class="menu-item active" data-view="mapa" data-tooltip="Mapa">
                    <i class="menu-icon mapa-icon fa-solid fa-map"></i>
                    <span>Mapa</span>
                </button>

                <button class="menu-item" data-view="rutas" data-tooltip="Mis rutas">
                    <i class="menu-icon rutas-icon fa-solid fa-route"></i>
                    <span>Mis rutas</span>
                </button>

                <button class="menu-item" data-view="entregas" data-tooltip="Entregas">
                    <i class="menu-icon entregas-icon fa-solid fa-truck"></i>
                    <span>Entregas</span>
                </button>

                <button class="menu-item" data-view="favoritos" data-tooltip="Favoritos">
                    <i class="menu-icon favoritos-icon fa-regular fa-star"></i>
                    <span>Favoritos</span>
                </button>

                <button class="menu-item" data-view="actividad" data-tooltip="Actividad">
                    <i class="menu-icon actividad-icon fa-solid fa-chart-column"></i>
                    <span>Actividad</span>
                </button>

            </nav>

            <!-- CATEGORÍAS -->
            <div class="sidebar-categories">

                <p class="menu-title">CATEGORÍAS</p>

                <button class="category-item active" type="button" data-category="todos" data-tooltip="Todos">
                    <span class="category-icon todos">
                        <i class="fa-solid fa-layer-group"></i>
                    </span>
                    <span>Todos</span>
                </button>

                <button class="category-item" type="button" data-category="favorito" data-tooltip="Favoritos">
                    <span class="category-icon favorito">
                        <i class="fa-solid fa-star"></i>
                    </span>
                    <span>Favoritos</span>
                </button>

                <button class="category-item" type="button" data-category="parque" data-tooltip="Parques">
                    <span class="category-icon parque">
                        <i class="fa-solid fa-tree"></i>
                    </span>
                    <span>Parques</span>
                </button>

                <button class="category-item" type="button" data-category="tienda" data-tooltip="Tiendas">
                    <span class="category-icon tienda">
                        <i class="fa-solid fa-bag-shopping"></i>
                    </span>
                    <span>Tiendas</span>
                </button>

                <button class="category-item" type="button" data-category="restaurante" data-tooltip="Restaurantes">
                    <span class="category-icon restaurante">
                        <i class="fa-solid fa-utensils"></i>
                    </span>
                    <span>Restaurantes</span>
                </button>

                <button class="category-item" type="button" data-category="otro" data-tooltip="Otros">
                    <span class="category-icon otros">
                        <i class="fa-solid fa-ellipsis"></i>
                    </span>
                    <span>Otros</span>
                </button>

            </div>

            <!-- BOTÓN DE MENÚ -->
            <div class="sidebar-bottom">

                <button id="sidebar-menu-button" class="sidebar-menu-button" type="button" aria-label="Colapsar menú" aria-expanded="true" aria-controls="sidebar">
                    <i class="fa-solid fa-bars"></i>
                    <span>Menú</span>
                </button>

            </div>

        </aside>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="main">

            <!-- HEADER - BARRA DE NAVEGACIÓN -->
            <header class="topbar">

                <!-- BUSCADOR -->
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input id="search-input" type="text" placeholder="Buscar lugar, ruta o referencia..." autocomplete="off">

                    <button id="search-button" type="button" aria-label="Buscar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                </div>

                <!-- ACCIONES -->
                <div class="topbar-actions">

                    <button class="icon-button" type="button" aria-label="Cambiar tema">
                        <i class="fa-solid fa-sun"></i>
                    </button>

                    <button class="action-link" type="button">
                        <i class="fa-solid fa-gear"></i>
                        <span>Configuración</span>
                    </button>

                    <button class="action-link" type="button">
                        <i class="fa-regular fa-circle-question"></i>
                        <span>Ayuda</span>
                    </button>

                    <button id="add-place-button" class="add-place-button" type="button">
                        <i class="fa-solid fa-plus"></i> Agregar lugar
                    </button>

                </div>

            </header>

            <!-- ÁREA VISUAL DEL MAPA -->
            <section id="vistaMapa" class="vista activa">

                <div class="map-area">
                    <!-- MAPA -->
                    <div id="map"></div>

                    <!-- BOTÓN DE UBICACIÓN -->
                    <button id="locate-button" class="map-control locate-control" type="button" title="Centrar en mi ubicación" aria-label="Centrar en mi ubicación">
                        <i class="fa-solid fa-location-arrow"></i>
                    </button>

                    <!-- PANEL DERECHO -->
                    <aside class="map-sidebar">

                        <!-- PANEL DERECHO: MIS RUTAS -->
                        <section class="floating-panel">
                            <div class="panel-header">
                                <h2>
                                    <i class="fa-solid fa-route"></i> Mis rutas
                                </h2>

                                <button id="close-routes-panel" class="panel-close" type="button" aria-label="Cerrar panel de rutas">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>

                            <!-- JAVASCRIPT INSERTARÁ LAS RUTAS -->
                            <div id="route-list" class="route-list"></div>

                            <button id="new-route-button" class="view-routes-button" type="button">
                                <i class="fa-solid fa-plus"></i> Crear nueva ruta
                            </button>
                        </section>

                        <!-- PANEL DERECHO: LUGARES RECIENTES -->
                        <section class="floating-panel recent-panel">
                            <div class="panel-header">
                                <h2>Lugares recientes</h2>
                                <button id="view-all-places" class="view-all-button" type="button">
                                    Ver todos
                                </button>
                            </div>

                            <!-- JAVASCRIPT INSERTARÁ LOS LUGARES -->
                            <div id="recent-list" class="recent-list"></div>
                        </section>

                    </aside>

                    <!-- BOTONES PARA HACER ZOOM -->
                    <div class="map-zoom">
                        <button id="zoom-in" type="button" aria-label="Acercar mapa">
                            <i class="fa-solid fa-plus"></i>
                        </button>

                        <button id="zoom-out" type="button" aria-label="Alejar mapa">
                            <i class="fa-solid fa-minus"></i>
                        </button>

                        <button id="map-center" type="button" aria-label="Centrar mapa">
                            <i class="fa-solid fa-crosshairs"></i>
                        </button>
                    </div>

                    <!-- CATEGORÍAS DEL MAPA -->
                    <div class="map-categories">
                        <button class="map-category blue" type="button" data-category="todos">
                            <i class="fa-solid fa-layer-group"></i> Todos
                        </button>

                        <button class="map-category red" type="button" data-category="favorito">
                            <i class="fa-solid fa-star"></i> Favoritos
                        </button>

                        <button class="map-category green" type="button" data-category="parque">
                            <i class="fa-solid fa-tree"></i> Parques
                        </button>

                        <button class="map-category purple" type="button" data-category="tienda">
                            <i class="fa-solid fa-bag-shopping"></i> Tiendas
                        </button>

                        <button class="map-category orange" type="button" data-category="restaurante">
                            <i class="fa-solid fa-utensils"></i> Restaurantes
                        </button>

                        <button class="map-category white" type="button" data-category="otro">
                            <i class="fa-solid fa-ellipsis"></i> Otros
                        </button>
                    </div>

                </div>
            </section>

            <!-- MIS RUTAS -->
            <section id="vistaRutas" class="vista">
                <div class="routes-page">
                    <div class="page-heading">
                        <div>
                            <h2>Mis rutas</h2>
                        </div>

                        <button id="new-route-page-button" class="primary-button" type="button">
                            <i class="fa-solid fa-plus"></i> Nueva ruta
                        </button>
                    </div>

                    <!-- JAVASCRIPT INSERTARÁ LAS RUTAS GUARDADAS -->
                    <div id="saved-routes-container" class="saved-routes-container"></div>
                </div>
            </section>

            <!-- ENTREGAS -->
            <section id="vistaEntregas" class="vista">
                <div class="placeholder-view">
                    <i class="fa-solid fa-truck"></i>
                    <h2>Entregas</h2>
                </div>
            </section>

            <!-- FAVORITOS -->
            <section id="vistaFavoritos" class="vista">
                <div class="favorites-page">
                    <div class="page-heading">
                        <h2>Favoritos</h2>
                    </div>

                    <!-- JAVASCRIPT INSERTARÁ LOS FAVORITOS -->
                    <div id="favorites-container" class="places-grid"></div>
                </div>
            </section>

            <!-- ACTIVIDAD -->
            <section id="vistaActividad" class="vista">
                <div class="placeholder-view">
                    <i class="fa-solid fa-chart-column"></i>
                    <h2>Actividad</h2>
                </div>
            </section>

        </main>
    </div>

    <!-- MODAL AGREGAR LUGAR -->

    <div id="add-place-modal" class="modal-overlay">

        <div class="place-modal">

            <!-- ENCABEZADO -->
            <header class="place-modal-header">
                <button id="close-modal" class="modal-back-button" type="button" aria-label="Cerrar">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>

                <div class="place-modal-title">
                    <span class="modal-eyebrow">NUEVO LUGAR</span>
                    <h2>Agregar nuevo lugar</h2>
                </div>

                <button class="modal-menu-button" type="button" aria-label="Más opciones">
                    <i class="fa-solid fa-ellipsis-vertical"></i>
                </button>
            </header>

            <!-- FORMULARIO -->
            <form id="place-form" class="place-form">

                <!-- COLUMNA IZQUIERDA -->
                <div class="place-form-left">

                    <!-- NOMBRE -->
                    <div class="form-group">
                        <label for="place-name">Nombre del lugar</label>
                        <input id="place-name" type="text" placeholder="Ej. Mercado Adolfo López" autocomplete="off" required>
                    </div>

                    <!-- CATEGORÍA -->
                    <div class="form-group">
                        <label for="place-category">Categoría</label>

                        <div class="select-wrapper">
                            <span id="category-preview-icon" class="select-icon">
                                <i class="fa-solid fa-store"></i>
                            </span>

                            <select id="place-category" required>
                                <option value="">Selecciona una categoría</option>
                                <option value="mercado">Mercado</option>
                                <option value="restaurante">Restaurante</option>
                                <option value="tienda">Tienda</option>
                                <option value="parque">Parque</option>
                                <option value="otro">Otro</option>
                            </select>
                        </div>
                    </div>

                    <!-- REFERENCIA -->
                    <div class="form-group">
                        <label for="place-reference">Referencia</label>
                        <input id="place-reference" type="text" placeholder="Ej. Junto al zócalo" autocomplete="off">
                    </div>

                    <!-- DIRECCIÓN -->
                    <div class="form-group">
                        <label for="place-address">Dirección</label>

                        <div class="address-input-wrapper">
                            <i class="fa-solid fa-location-dot"></i>
                            <input id="place-address" type="text" placeholder="Ej. Cuernavaca, Morelos" autocomplete="street-address" required>

                            <span id="address-loading" class="address-loading" aria-hidden="true">
                                <i class="fa-solid fa-spinner fa-spin"></i>
                            </span>
                        </div>
                    </div>

                    <!-- NOTAS -->
                    <div class="form-group notes-group">
                        <label for="place-notes">Notas</label>
                        <textarea id="place-notes" rows="4" placeholder="Escribe alguna nota sobre este lugar..."></textarea>
                    </div>

                </div>

                <!-- COLUMNA DERECHA -->
                <div class="place-form-right">

                    <!-- MAPA DE PREVISUALIZACIÓN -->
                    <div class="place-preview-map-wrapper">
                        <div id="place-preview-map" class="place-preview-map"></div>

                        <div class="preview-map-label">
                            <i class="fa-solid fa-location-dot"></i>
                            Vista previa
                        </div>
                    </div>

                    <!-- SELECTOR DE MARCADOR -->
                    <div class="marker-selector">
                        <label>Elegir color y marcador</label>

                        <div id="marker-options" class="marker-options">
                            <button class="marker-option active" type="button" data-color="#ff334f" data-icon="fa-utensils" title="Restaurante" aria-label="Marcador de restaurante">
                                <i class="fa-solid fa-utensils"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#ff8a00" data-icon="fa-cart-shopping" title="Compras" aria-label="Marcador de compras">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#ffbd17" data-icon="fa-star" title="Favorito" aria-label="Marcador de favorito">
                                <i class="fa-solid fa-star"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#16c765" data-icon="fa-tree" title="Parque" aria-label="Marcador de parque">
                                <i class="fa-solid fa-tree"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#00a9e8" data-icon="fa-bag-shopping" title="Tienda" aria-label="Marcador de tienda">
                                <i class="fa-solid fa-bag-shopping"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#216cff" data-icon="fa-store" title="Mercado" aria-label="Marcador de mercado">
                                <i class="fa-solid fa-store"></i>
                            </button>

                            <button class="marker-option" type="button" data-color="#a72cff" data-icon="fa-shop" title="Otro" aria-label="Otro marcador">
                                <i class="fa-solid fa-shop"></i>
                            </button>
                        </div>
                    </div>

                    <!-- FAVORITO -->
                    <label class="favorite-toggle-row" for="place-favorite">
                        <div class="favorite-toggle-info">
                            <i class="fa-regular fa-star"></i>
                            <span>Agregar a favoritos</span>
                        </div>

                        <div class="switch">
                            <input id="place-favorite" type="checkbox">
                            <span class="switch-slider"></span>
                        </div>
                    </label>

                    <!-- MENSAJE DE ESTADO -->
                    <div id="place-status" class="place-status" aria-live="polite"></div>
                </div>

                <!-- ACCIONES -->
                <div class="place-form-actions">
                    <button id="cancel-modal" class="secondary-button" type="button">
                        Cancelar
                    </button>

                    <button class="primary-button save-place-button" type="submit">
                        <i class="fa-solid fa-check"></i>
                        Guardar lugar
                    </button>
                </div>

            </form>
        </div>
    </div>

    <!-- ==========================================
         MODAL NUEVA RUTA
    =========================================== -->

    <div id="route-modal" class="modal-overlay">

        <div class="modal">
            <!-- ENCABEZADO -->
            <div class="modal-header">
                <div>
                    <h2>Crear nueva ruta</h2>
                </div>

                <button id="close-route-modal" class="modal-close" type="button" aria-label="Cerrar">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <!-- FORMULARIO -->
            <form id="route-form">
                <div class="form-group">
                    <label for="route-name">Nombre de la ruta</label>
                    <input id="route-name" type="text" placeholder="Ej. Ruta de compras" required>
                </div>

                <div class="form-group">
                    <label for="route-origin">Origen</label>
                    <input id="route-origin" type="text" placeholder="Ej. Cuernavaca, Morelos" required>
                </div>

                <div class="form-group">
                    <label for="route-destination">Destino</label>
                    <input id="route-destination" type="text" placeholder="Ej. Jiutepec, Morelos" required>
                </div>

                <!-- ESTADO DE LA RUTA -->
                <div id="route-status" class="route-status"></div>

                <!-- ACCIONES DEL FORMULARIO -->
                <div class="modal-actions">
                    <button id="cancel-route-modal" class="secondary-button" type="button">
                        Cancelar
                    </button>

                    <button id="calculate-route-button" class="primary-button" type="submit">
                        <i class="fa-solid fa-route"></i> Calcular ruta
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- LEAFLET -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- DATOS -->
    <script src="js/storage.js"></script>

    <!-- JAVASCRIPT PRINCIPAL -->
    <script src="js/script.js"></script>

</body>
</html>
