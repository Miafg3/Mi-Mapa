<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="app">

        <aside class="sidebar">
            <div class="logo">
                <span class="logo-icon">📍</span>

                <div>
                    <h1>Mi Mapa</h1>
                    <p>Mis rutas, mis lugares</p>
                </div>
            </div>

            <nav class="menu">
                <button class="menu-item active">
                    <span>🗺️</span>
                    <span>Mapa</span>
                </button>

                <button class="menu-item">
                    <span>🛣️</span>
                    <span>Mis rutas</span>
                </button>

                <button class="menu-item">
                    <span>📍</span>
                    <span>Lugares</span>
                </button>

                <button class="menu-item">
                    <span>⭐</span>
                    <span>Favoritos</span>
                </button>

                <button class="menu-item">
                    <span>📝</span>
                    <span>Notas</span>
                </button>
            </nav>

            <div class="categories">
                <p class="section-title">Categorías</p>
                <button class="category active">Todos</button>
                <button class="category">🚚 Entregas</button>
                <button class="category">🛒 Favoritos</button>
                <button class="category">🏪 Tiendas</button>
                <button class="category">🌳 Parques</button>
            </div>
        </aside>

        <main class="main">

            <header class="header">
            <!-- 
                <div class="brand">
                    <span>📍</span>
                    <strong>Mi Mapa</strong>
                </div> 
            -->

                <div class="search">
                    <input id="search-input" type="search" placeholder="Buscar lugar, ruta o referencia...">
                    <button id="search-button">🔍</button>
                </div>

                <div class="header-actions">
                    <button>☀️</button>
                    <button>⚙️ Configuración</button>
                    <button>❓ Ayuda</button>
                    <button class="add-place" id="add-place-button">+ Agregar lugar</button>
                </div>

            </header>

            <section class="map-container">

                <button class="show-routes" id="show-routes">🛣️</button>

                <div id="map"></div>

                <aside class="routes-panel">

                    <div class="panel-header">
                        <h2>Mis rutas</h2>
                        <button id="close-routes">×</button>
                    </div>

                    <div class="route">
                        <span class="route-color blue"></span>

                        <div>
                            <strong>R</strong>
                            <small>12 – 20 min</small>
                        </div>

                        <span>3.2 km</span>
                    </div>

                    <div class="route">
                        <span class="route-color purple"></span>

                        <div>
                            <strong>C</strong>
                            <small>12 – 14 min</small>
                        </div>

                        <span>4.1 km</span>
                    </div>

                    <div class="route">
                        <span class="route-color green"></span>

                        <div>
                            <strong>T</strong>
                            <small>30 – 40 min</small>
                        </div>

                        <span>7.8 km</span>
                    </div>

                    <button class="view-routes" id="view-routes">
                        Ver todas las rutas →
                    </button>

                </aside>
            </section>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
