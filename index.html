<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Mi Mapa</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/icons/favicon.png">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="app">

        <aside class="sidebar">

            <div class="logo">
                <span class="logo-icon">📍</span>

                <div>
                    <h1>Mi Mapa</h1>
                    <p>Mis rutas, mis lugares</p>
                </div>
            </div>

            <nav class="menu">
                <button class="menu-item active" type="button">
                    <span>🗺️</span>
                    <span>Mapa</span>
                </button>

                <button class="menu-item" type="button">
                    <span>🛣️</span>
                    <span>Mis rutas</span>
                </button>

                <button class="menu-item" type="button">
                    <span>📍</span>
                    <span>Lugares</span>
                </button>

                <button class="menu-item" type="button">
                    <span>🚚</span>
                    <span>Entregas</span>
                </button>

                <button class="menu-item" type="button">
                    <span>⭐</span>
                    <span>Favoritos</span>
                </button>

                <button class="menu-item" type="button">
                    <span>📝</span>
                    <span>Notas</span>
                </button>
            </nav>

            <div class="categories">
                <p class="section-title">Categorías</p>
                <button class="category active" type="button">Todos</button>
                <button class="category" type="button">🚚 Entregas</button>
                <button class="category" type="button">🛒 Mis Rutas</button>
                <button class="category" type="button">🏪 Tiendas</button>
                <button class="category" type="button">🌳 Parques</button>
            </div>

        </aside>

        <main class="main">

            <header class="header">

                <div class="brand">
                    <span>📍</span>
                    <strong>Mi Mapa</strong>
                </div>

                <div class="search">
                    <input id="search-input" type="search" placeholder="Buscar lugar, ruta o referencia...">
                    <button id="search-button" type="button">🔍</button>
                </div>

                <div class="header-actions">
                    <button type="button">☀️</button>
                    <button type="button">⚙️ Configuración</button>
                    <button type="button">❓ Ayuda</button>
                    <button class="add-place" id="add-place-button" type="button">+ Agregar lugar</button>
                </div>

            </header>

            <section class="map-container">

                <div class="directions-panel">

                    <div class="directions-header">
                        <div>
                            <span class="panel-kicker">NAVEGACIÓN</span>
                            <h2>¿A dónde quieres ir?</h2>
                        </div>
                    </div>

                    <div class="location-input">
                        <span class="location-icon origin">●</span>
                        <input id="origin-input" type="text" placeholder="Desde..." autocomplete="off">
                    </div>

                    <div class="location-input">
                        <span class="location-icon destination">●</span>
                        <input id="destination-input" type="text" placeholder="¿A dónde quieres ir?" autocomplete="off">
                    </div>

                    <button class="route-button" id="route-button" type="button">
                        🧭 <span>Cómo llegar</span>
                    </button>

                    <div class="transport-options">
                        <button class="transport-option active" type="button" data-mode="car">
                            🚗 <span>Auto</span>
                        </button>

                        <button class="transport-option" type="button" data-mode="public">
                            🚌 <span>Público</span>
                        </button>

                        <button class="transport-option" type="button" data-mode="walk">
                            🚶 <span>Caminar</span>
                        </button>
                    </div>

                </div>

                <div id="map"></div>

                <aside class="routes-panel" id="routes-panel">

                    <div class="panel-header">
                        <div>
                            <span class="panel-kicker">RESULTADOS</span>
                            <h2>Tu ruta</h2>
                        </div>

                        <button id="close-routes" type="button" aria-label="Cerrar resultados">×</button>
                    </div>

                    <div class="route-empty" id="route-empty">
                        <div class="empty-icon">🧭</div>
                        <h3>Busca una ruta</h3>
                        <p>
                            Introduce un origen y un destino
                            para ver las opciones disponibles.
                        </p>
                    </div>

                    <div class="route-results" id="route-results"></div>

                </aside>

                <button class="show-routes" id="show-routes" type="button" aria-label="Mostrar resultados">
                    🧭
                </button>

            </section>

        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
